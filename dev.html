<!DOCTYPE html>
<html lang="ja">
<head>

<title>開発情報 | 白急線ポータル</title>
<style>
  :root{--navy:#0b1a4a;--blue-ink:#1a4fb0;--band:#e6eef9;--ink:#111;--ink-dim:#5c6b82;--rule:#d5deec}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}
  a{color:var(--blue-ink)}
  .hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
    padding:max(10px,env(safe-area-inset-top)) 10px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .hdr h1{margin:0;font-size:19px;font-weight:700;text-align:center;white-space:nowrap}
  .hbtn{background:transparent;border:1.5px solid #fff;border-radius:6px;color:#fff;padding:7px 12px;font-size:15px;font-weight:600;text-decoration:none;justify-self:start}
  .doc{padding:18px 16px 40px;max-width:760px;margin:0 auto;line-height:1.8;font-size:16px}
  .doc h2{font-size:22px;margin:26px 0 10px;padding-left:14px;border-left:4px dotted #333;line-height:1.3}
  .doc h2:first-child{margin-top:4px}
  .doc ul{padding-left:24px;margin:0}
  .doc .box{border:1.5px solid var(--blue-ink);border-radius:12px;padding:12px 16px;margin:10px 0;background:#fff}
  .doc .date{color:var(--ink-dim);font-size:13px}
  .doc table{border-collapse:collapse;width:100%;font-size:15px}
  .doc th,.doc td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
  .doc th{color:var(--ink-dim);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
