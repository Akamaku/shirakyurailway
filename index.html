<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白急線ポータル</title>
<style>
  :root{
    --navy:#0b1a4a; --navy-deep:#071236; --blue:#1e5bd8; --blue-ink:#1a4fb0;
    --band:#e6eef9; --band-dark:#a9c4f0; --ink:#111; --ink-dim:#5c6b82; --rule:#d5deec; --red:#d62020;
    --st-h:96px; --seg-h:112px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    font-feature-settings:"tnum" 1}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--blue-ink)}
  :focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
  .page{display:none}.page.show{display:block}

  /* 上部ツールバー（☰ ↵ 🏠） */
  .tb{position:sticky;top:0;z-index:21;background:linear-gradient(#a9c1ea,#7fa1dc);padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:flex;gap:10px;align-items:center}
  .tb .ib{width:58px;height:50px;border:2px solid #4b5f8f;border-radius:12px;background:linear-gradient(#fff,#e6ecf7);display:flex;align-items:center;justify-content:center;padding:0}
  .tb .ib svg{width:30px;height:30px;fill:none;stroke:#1d2f66;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .tb .ib:active{background:#d7e1f5}
  .tb .sp{flex:1}
  .menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none}
  .menu.show{display:block}
  .menu .box{position:absolute;left:0;top:0;bottom:0;width:min(78vw,300px);background:#fff;padding:max(16px,env(safe-area-inset-top)) 0 16px;overflow:auto}
  .menu h2{font-size:14px;color:var(--ink-dim);font-weight:600;margin:0 16px 8px}
  .menu .item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 16px;font-size:18px;color:var(--navy);font-weight:600}
  .menu .item.file{position:relative;overflow:hidden;color:var(--blue-ink);font-weight:500;font-size:15px}
  .menu .item.file input{position:absolute;inset:0;opacity:0}

  /* ヘッダー */
  .hdr{position:sticky;top:66px;z-index:20;background:var(--navy);color:#fff;
    padding:10px 10px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px}
  .hdr .ttl{text-align:center;white-space:nowrap}
  .hdr h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.02em}
  .hdr .now{font-size:12px;color:#c9d2ee;margin-top:2px;font-variant-numeric:tabular-nums}
  .hbtn{background:transparent;border:1.5px solid #fff;border-radius:6px;color:#fff;padding:7px 12px;font-size:15px;font-weight:600;white-space:nowrap}
  .hbtn:active{background:rgba(255,255,255,.15)}
  .hdr .r{justify-self:end}
  .sub{background:var(--navy-deep);color:#fff;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
  .sub select{background:var(--navy);border:1px solid #3c4f8a;border-radius:5px;padding:4px 6px;color:#fff}
  .sim{display:none;width:100%;align-items:center;gap:8px}
  .sim.show{display:flex}
  .sim input[type=range]{flex:1;accent-color:#fff}
  .sim button{background:transparent;border:1.5px solid #fff;border-radius:5px;color:#fff;padding:3px 10px}

  /* ホーム */
  .home{padding:24px 16px 40px;max-width:720px;margin:0 auto}
  .home h2{text-align:center;font-size:24px;margin:4px 0 12px;color:#222}
  .home p{color:#333;line-height:1.7;margin:0 0 20px;font-size:15px}
  .home hr{border:0;border-top:2px solid #cfd6e3;margin:0 0 24px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .tile{aspect-ratio:1;border:2.5px solid var(--blue-ink);border-radius:18px;background:#fff;color:var(--blue-ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:21px;font-weight:700}
  .tile svg{width:64px;height:64px;fill:none;stroke:var(--blue-ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .tile:active{background:var(--band)}

  /* 走行位置 */
  .track{position:relative;overflow:hidden;--pad:20px}
  .track .line{position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:var(--blue)}
  .st{position:absolute;left:0;right:0;height:var(--st-h);background:var(--band)}
  .st .tag{position:absolute;left:0;top:0;bottom:0;width:26%;max-width:190px;background:var(--band-dark);clip-path:polygon(0 0,100% 0,65% 100%,0 100%)}
  .st .nm{position:absolute;left:12px;top:10px;font-size:20px;font-weight:800;color:var(--navy);z-index:1;white-space:nowrap}
  .st .nm.xfer{text-decoration:underline;cursor:pointer}
  .modal .xlist{list-style:none;margin:0;padding:0}
  .modal .xlist li{border-bottom:1px solid var(--rule)}
  .modal .xlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 4px;font-size:18px;color:#1a5cff}
  .st .dot{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%)}
  .tr{position:absolute;display:flex;align-items:center;gap:10px;transform:translateY(-50%);cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
  .tr.up{right:calc(50% + 30px);flex-direction:row-reverse}
  .tr.dn{left:calc(50% + 30px)}
  .tr .chev{width:34px;height:52px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .tr .lbl{line-height:1.25;white-space:nowrap}
  .tr.up .lbl{text-align:right}
  .tr .no{font-size:17px;font-weight:500}
  .tr .no b{display:inline-block;min-width:1.3em;padding:0 4px;margin-right:4px;border-radius:4px;color:#fff;font-size:14px;text-align:center;line-height:1.35;vertical-align:1px}
  .tr .dest{font-size:16px;color:#222}

  /* 列車ポップアップ */
  .modalbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .modalbg.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #ddd;font-size:22px;font-weight:700}
  .modal .mh button{background:none;border:0;font-size:28px;line-height:1;color:#333;padding:0 4px}
  .modal .mb{padding:14px 18px 18px}
  .modal .l1{font-size:19px;line-height:1.5}
  .modal .l1 .num{font-size:30px;font-weight:600;letter-spacing:.02em}
  .modal .l1 .typ{font-size:16px;color:#444}
  .modal .l2{font-size:18px;margin:6px 0 14px}
  .modal table{width:100%;border-collapse:collapse;font-size:15px}
  .modal th{font-weight:400;color:var(--ink-dim);text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule)}
  .modal td{padding:6px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
  .modal td.t{text-align:right;font-variant-numeric:tabular-nums}
  .modal td.pass{color:var(--ink-dim)}
  .modal tr.now td{background:#fff5cc;font-weight:700}
  .modal tr.done td{color:#9aa}
  .modal .bikou{font-size:12px;color:var(--ink-dim);margin:10px 0 0}

  /* 運用表 */
  .doc{padding:18px 16px 40px;max-width:760px;margin:0 auto}
  .doc h2{font-size:24px;margin:0 0 14px;padding-left:14px;border-left:4px dotted #333;line-height:1.3}
  .doc ul{padding-left:28px;margin:0;font-size:19px;line-height:2.4}
  .doc ul.compact{line-height:2.1}
  .doc a.wd{color:#1a5cff}.doc a.hd{color:#e00}
  .doc a.run{color:var(--red);font-weight:700}
  .doc a{text-decoration:none;cursor:pointer}
  .doc .box{border-left:2px solid var(--blue-ink);border-right:2px solid var(--blue-ink);padding:6px 0 8px}
  .doc .box h3{font-size:24px;color:var(--blue-ink);margin:0 0 6px 16px;padding-bottom:8px;border-bottom:2px solid #dde3ef}
  .flow{width:100%;border-collapse:collapse;font-size:20px;font-variant-numeric:tabular-nums}
  .flow td{padding:9px 6px;white-space:nowrap}
  .flow td.no{color:#1a5cff;padding-left:22px;font-weight:500}
  .flow td.no small{font-size:13px;color:#555;margin-left:6px;font-weight:400}
  .flow td.t{text-align:right}
  .flow td.ar{text-align:center;color:#444}
  .flow tr.run td,.flow tr.run td.no,.flow tr.run td.no small{color:var(--red)}
  .doc .note{font-size:13px;color:#555;margin:12px 0 0 16px}
  @media (max-width:480px){
    .doc{padding:14px 8px 40px}
    .doc h2{font-size:21px}
    .doc ul{font-size:17px;padding-left:24px}
    .doc .box h3{font-size:20px;margin-left:8px}
    .flow{font-size:13px;width:100%;table-layout:auto}
    .flow td{padding:6px 2px;white-space:nowrap;overflow:visible}
    .flow td.no{padding-left:4px;font-size:14px;line-height:1.15}
    .flow td.no small{display:block;font-size:10px;margin-left:0}
    .flow td.t{padding-left:2px;padding-right:2px}
    .flow td.ar{padding:0 2px}
    .doc .note{margin-left:8px}
  }

  /* 時刻表 */
  .ttwrap{overflow:auto;max-height:calc(100vh - 210px)}
  .tt{border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tt th,.tt td{border-right:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;padding:3px 6px;text-align:center;min-width:46px;background:#fff}
  .tt thead th{background:#f3d9b5;position:sticky;z-index:3}
  .tt thead tr:nth-child(1) th{top:0}
  .tt thead tr:nth-child(2) th{top:29px}
  .tt thead tr:nth-child(3) th{top:58px}
  .tt th.stn,.tt td.stn{position:sticky;left:0;background:#f3d9b5;text-align:left;font-weight:700;z-index:2;min-width:96px}
  .tt thead th.stn{z-index:4}
  .tt td.pass{color:#666;font-size:11px}
  .tt td sup{font-size:9px;color:var(--blue-ink);margin-left:1px}
  .tt .cars{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid #333;line-height:18px;font-size:11px;background:#fff}
  .tt td.major{background:#fbfbfb}
</style>
</head>
<body>
<div class="tb">
  <button class="ib" id="tbMenu" aria-label="メニュー"><svg viewBox="0 0 30 30"><line x1="5" y1="8" x2="25" y2="8"/><line x1="5" y1="15" x2="25" y2="15"/><line x1="5" y1="22" x2="25" y2="22"/></svg></button>
  <button class="ib" id="tbBack" aria-label="戻る"><svg viewBox="0 0 30 30"><path d="M24 6 v11 H8"/><path d="M13 12 l-5 5 5 5"/></svg></button>
  <span class="sp"></span>
  <button class="ib" id="tbHome" aria-label="ホーム"><svg viewBox="0 0 30 30"><path d="M4 15 L15 5 L26 15"/><path d="M7 13 V25 h16 V13"/><path d="M20 6 h3 v5"/></svg></button>
</div>
<div class="menu" id="menu"><div class="box">
  <h2>メニュー</h2>
  <button class="item" data-go="home">ホーム</button>
  <button class="item" data-go="tt">時刻表</button>
  <button class="item" data-go="posSel">走行位置</button>
  <button class="item" data-go="ops">運用表</button>
  <label class="item file">別の .oud2 ファイルを開く<input type="file" id="file" accept=".oud2,.oud,.txt"></label>
</div></div>

<!-- ===== ホーム ===== -->
<section class="page" id="pg-home">
  <header class="hdr"><span></span><div class="ttl"><h1 id="homeTitle">白急線ポータル</h1></div><span></span></header>
  <div class="home">
    <h2 id="homeH">白急線ポータルへようこそ！</h2>
    <p>白急各線の時刻表・列車走行位置・車両運用をまとめています。</p>
    <hr>
    <div class="tiles">
      <button class="tile" data-go="tt">
        <svg viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="44" rx="4"/><line x1="8" y1="26" x2="56" y2="26"/><line x1="24" y1="26" x2="24" y2="56"/><line x1="40" y1="26" x2="40" y2="56"/><line x1="8" y1="41" x2="56" y2="41"/><line x1="18" y1="6" x2="18" y2="16"/><line x1="46" y1="6" x2="46" y2="16"/></svg>
        時刻表</button>
      <button class="tile" data-go="posSel">
        <svg viewBox="0 0 64 64"><path d="M14 52 V16 a8 8 0 0 1 8 -8 h20 a8 8 0 0 1 8 8 v36"/><path d="M12 52 h40"/><path d="M20 20 h24 v14 h-24z"/><circle cx="22" cy="44" r="2.5"/><circle cx="42" cy="44" r="2.5"/><path d="M8 60 l8 -8"/><path d="M56 60 l-8 -8"/></svg>
        走行位置</button>
      <button class="tile" data-go="ops">
        <svg viewBox="0 0 64 64"><line x1="14" y1="12" x2="14" y2="52" stroke-width="7"/><line x1="24" y1="12" x2="52" y2="12"/><line x1="24" y1="22" x2="52" y2="22"/><line x1="24" y1="32" x2="52" y2="32"/><line x1="24" y1="42" x2="52" y2="42"/><line x1="24" y1="52" x2="52" y2="52"/></svg>
        運用表</button>
    </div>
  </div>
</section>

<!-- ===== 走行位置：路線選択 ===== -->
<section class="page" id="pg-posSel">
  <header class="hdr"><span></span><div class="ttl"><h1>走行位置</h1></div><span></span></header>
  <div class="doc"><h2>路線を選択</h2><ul id="posRouteList"></ul></div>
</section>

<!-- ===== 走行位置 ===== -->
<section class="page" id="pg-pos">
  <header class="hdr">
    <span></span>
    <div class="ttl"><h1 id="posTitle">—</h1><div class="now" id="posNow"></div></div>
    <button class="hbtn r" id="refreshBtn">更新</button>
  </header>
  <div class="sub">
    <select id="posDia" aria-label="ダイヤ"></select>
  </div>
  <div class="track" id="track"></div>
</section>

<!-- ===== 運用表 ===== -->
<section class="page" id="pg-ops">
  <header class="hdr">
    <span></span>
    <div class="ttl"><h1>運用表</h1><div class="now" id="opsNow"></div></div><span></span>
  </header>
  <div class="doc" id="opsBody"></div>
</section>

<!-- ===== 時刻表 ===== -->
<section class="page" id="pg-tt">
  <header class="hdr">
    <span></span>
    <div class="ttl"><h1 id="ttTitle">時刻表</h1></div><span></span>
  </header>
  <div class="sub">
    <select id="ttRoute"></select>
    <select id="ttDia"></select>
    <select id="ttDir"><option value="d">下り</option><option value="u">上り</option></select>
    <select id="ttHour"><option value="">全時間帯</option></select>
  </div>
  <div class="ttwrap" id="ttBody"></div>
</section>

<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="chevDn" viewBox="0 0 34 52"><path d="M0 0 L17 16 L34 0 L34 36 L17 52 L0 36 Z"/></symbol>
  <symbol id="chevUp" viewBox="0 0 34 52"><path d="M0 52 L17 36 L34 52 L34 16 L17 0 L0 16 Z"/></symbol>
</defs></svg>

<script>
/* ========== 設定 ========== */
const MARKS  = {'普通':'', '準急':'準', '急行':'急', '通勤急行':'通'};
const HIDDEN = ['臨時','回送','試運転'];        // 全画面で非表示
const CARS_DEFAULT = 8;
const CHEV_COLOR = {'普通':'#111'};
const REFRESH_MS = 15000;                        // 走行位置の更新間隔
const DAY_START = 4*3600;                        // 1日の起点 4:00（0:00〜3:59は前日扱い＝24時〜27時）

/* ========== 1. .oud2 パーサー ========== */
function parseOud2(text, fallbackName){
  const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/);
  function parseBlock(i){
    const node = {_children:[]};
    for(; i<lines.length; i++){
      const l = lines[i].trim();
      if(l==='.') return [node,i+1];
      const eq=l.indexOf('=');
      if(eq<0 && l.endsWith('.')){ const [child,next]=parseBlock(i+1); child._type=l.slice(0,-1); node._children.push(child); i=next-1; }
      else if(eq>=0){ node[l.slice(0,eq)] = l.slice(eq+1); }
    }
    return [node,i];
  }
  const [root]=parseBlock(0);
  const rosen=root._children.find(c=>c._type==='Rosen');
  if(!rosen) throw new Error('Rosen ブロックが見つかりません');
  const stations=rosen._children.filter(c=>c._type==='Eki').map(e=>{
    const tc=e._children.find(c=>c._type==='EkiTrack2Cont');
    const tracks=tc? tc._children.filter(c=>c._type==='EkiTrack2').map(t=>t.TrackRyakusyou||t.TrackName||''):[];
    return {name:e.Ekimei||'', short:e.EkimeiJikokuRyaku||e.Ekimei||'', major:(e.Ekikibo||'').includes('Syuyou'), tracks};
  });
  const types=rosen._children.filter(c=>c._type==='Ressyasyubetsu').map(t=>({name:t.Syubetsumei||'', color:oudColor(t.DiagramSenColor)}));
  const dias=rosen._children.filter(c=>c._type==='Dia').map(d=>{
    const trains=[];
    for(const dir of d._children){
      if(dir._type!=='Kudari'&&dir._type!=='Nobori') continue;
      for(const r of dir._children.filter(c=>c._type==='Ressya')){ const tr=buildTrain(r,dir._type==='Kudari',stations.length,types); if(!tr.hidden) trains.push(tr); }
    }
    return {name:d.DiaName||'ダイヤ', trains, holiday:/土休|休日|土日/.test(d.DiaName||'')};
  });
  return {rosenName:rosen.Rosenmei||fallbackName||'路線', stations, types, dias};
}
function oudColor(s){ if(!s||s.length<6) return '#888'; const h=s.slice(-6); return '#'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2); }
function toSec(t){
  if(!t) return null; t=t.replace(/:/g,''); if(!/^\d+$/.test(t)) return null;
  let h,m,s=0;
  if(t.length<=4){h=+t.slice(0,-2)||0;m=+t.slice(-2);}else{h=+t.slice(0,-4);m=+t.slice(-4,-2);s=+t.slice(-2);}
  return h*3600+m*60+s;
}
function buildTrain(r, down, n, types){
  const stops=[];
  (r.EkiJikoku||'').split(',').forEach((e,i)=>{
    if(!e) return;
    const [kindPart, trackS]=e.split('$');
    const [kindS, timeS='']=kindPart.split(';');
    const kind=+kindS; if(kind!==1&&kind!==2) return;
    let arr=null,dep=null;
    if(timeS.includes('/')){const [a,d]=timeS.split('/');arr=toSec(a);dep=toSec(d);} else dep=toSec(timeS);
    stops.push({idx: down? i : n-1-i, kind, arr, dep, track: (trackS!==undefined&&trackS!=='')? +trackS : null});
  });
  let last=null;
  for(const s of stops){
    if(s.arr==null) s.arr=s.dep; if(s.dep==null) s.dep=s.arr;
    if(s.arr!=null){ if(last!=null&&s.arr<last-43200) s.arr+=86400; if(s.dep<s.arr) s.dep+=86400; last=s.dep; }
  }
  const timed=stops.filter(s=>s.arr!=null);
  if(timed.length && timed[0].arr<DAY_START) for(const s of timed){ s.arr+=86400; s.dep+=86400; }
  const type=types[+r.Syubetsu]||{name:'',color:'#888'};
  return {down, type, trainNo:r.Ressyamei||'', opNo:r.Ressyabangou||'', bikou:r.Bikou||'', cars:CARS_DEFAULT, stops,
    first: timed[0]||null, lastStop: timed[timed.length-1]||null,
    destIdx: timed.length? timed[timed.length-1].idx:null, hidden:HIDDEN.includes(type.name)};
}

/* ========== 2. 位置計算 ========== */
function locate(train, t){
  const st=train.stops.filter(s=>s.arr!=null); if(st.length<2) return null;
  for(const now of [t]){
    if(now<st[0].dep||now>st[st.length-1].arr) continue;
    for(let i=0;i<st.length;i++){
      const s=st[i];
      if(now>=s.arr&&now<=s.dep&&s.kind===1) return {state:'stop', idx:s.idx, stop:s, now};
      const nx=st[i+1]; if(!nx) break;
      if(now>s.dep&&now<nx.arr){
        // 前後の時刻から「どの駅間にいるか」を推定し、その駅間の中間に置く
        const p=(now-s.dep)/(nx.arr-s.dep);
        const f=s.idx+(nx.idx-s.idx)*p;
        let a=train.down? Math.floor(f) : Math.ceil(f);
        let b=train.down? a+1 : a-1;

/* ========== ページ切替 ========== */
const nav=[];                       // 画面遷移の履歴（戻るボタン用）
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('show',p.id==='pg-'+id));
  window.scrollTo(0,0);
  if(id==='pos') posEnter(); else posLeave();
  if(id==='posSel') renderPosSel();
  if(id==='ops') renderOps();
  if(id==='tt'){ refreshTTRoute(); renderTT(); }
}
function go(id, state){
  if(id==='ops') opsState= state||{dia:null,op:null};
  nav.push({id, ops:{...opsState}, route:curRoute});
  show(id);
}
function back(){
  if(nav.length<=1){ nav.length=0; go('home'); return; }
  nav.pop();
  const prev=nav[nav.length-1];
  if(prev.route!==curRoute) setRoute(prev.route);
  opsState={...prev.ops};
  show(prev.id);
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ $('menu').classList.remove('show'); go(b.dataset.go); });
$('tbBack').onclick=back;
$('tbHome').onclick=()=>{ nav.length=0; go('home'); };
$('tbMenu').onclick=()=>$('menu').classList.add('show');
$('menu').onclick=e=>{ if(e.target===$('menu')) $('menu').classList.remove('show'); };

/* ========== 走行位置：路線選択 ========== */
function renderPosSel(){
  $('posRouteList').innerHTML=ROUTES.map((r,i)=>`<li><a class="wd" data-i="${i}">${esc(routeName(i))}</a></li>`).join('');
  $('posRouteList').querySelectorAll('a').forEach(a=>a.onclick=()=>{ setRoute(+a.dataset.i); go('pos'); });
}

/* ========== 走行位置 ========== */
const ST_H=96, SEG_H=190, PAD=20;   // 駅間は列車3本（56px×3）が縦に入る高さ
let posDia=0, timer=null, curT=0, selected=null;
const yOf=idx=>PAD+idx*(ST_H+SEG_H)+ST_H/2;

function buildTrack(){
  const n=data.stations.length, H=PAD*2+n*ST_H+(n-1)*SEG_H;
  let s=`<div class="line"></div>`;
  data.stations.forEach((st,i)=>{
    const xfer=otherRoutesWithStation(st.name).length>0;
    s+=`<div class="st" style="top:${yOf(i)-ST_H/2}px"><div class="tag"></div><div class="nm ${xfer?'xfer':''}" data-st="${esc(st.name)}">${esc(st.name)}</div><div class="dot"></div></div>`; });
  s+=`<div id="trains"></div>`;
  const tk=$('track'); tk.style.height=H+'px'; tk.innerHTML=s;
  $('trains').addEventListener('click',e=>{const g=e.target.closest('.tr'); if(g) openModal(+g.dataset.k);});
  tk.querySelectorAll('.nm.xfer').forEach(el=>el.onclick=()=>openXfer(el.dataset.st));
  $('posTitle').textContent=data.rosenName;
}
function renderPos(t){
  curT=t;
  const g=$('trains'); if(!g) return;
  const trains=data.dias[posDia].trains, buckets={};
  const keep=new Set();
  for(let k=0;k<trains.length;k++){
    const tr=trains[k]; if(tr.hidden) continue;
    const loc=locate(tr,t); if(!loc) continue;
    keep.add('tr'+k);
    let y= loc.state==='stop'? yOf(loc.idx) : (yOf(loc.from)+yOf(loc.to))/2;
    const key=(tr.down?'d':'u')+Math.round(y);
    const n=(buckets[key]=(buckets[key]||0)+1);   // 同じ位置・同方面は縦並び
    y+=(n-1)*56;
    let el=g.querySelector('#tr'+k);
    if(!el){
      el=document.createElement('div'); el.className='tr '+(tr.down?'dn':'up'); el.id='tr'+k; el.dataset.k=k;
      const mark=MARKS[tr.type.name]??tr.type.name.slice(0,1), c=chevColor(tr);
      el.innerHTML=`<svg class="chev" style="fill:${c}"><use href="#${tr.down?'chevDn':'chevUp'}"/></svg>
        <div class="lbl"><div class="no">${mark?`<b style="background:${c}">${esc(mark)}</b>`:''}${esc(tr.trainNo)}[${tr.cars}]</div>
        <div class="dest">${esc(tr.destIdx!=null?data.stations[tr.destIdx].name:'')}</div></div>`;
      g.appendChild(el);
    }
    el.style.top=y+'px';
  }
  g.querySelectorAll('.tr').forEach(el=>{ if(!keep.has(el.id)) el.remove(); });
  $('posNow').textContent=`${dateStr()} ${fmt(t)} 現在`;
  if(selected!=null && $('modalbg').classList.contains('show')) renderModal(t);
}
function refresh(){ renderPos(nowSec()); }
function posEnter(){ posLeave(); buildTrack(); refresh(); timer=setInterval(refresh,REFRESH_MS); }
function posLeave(){ if(timer){clearInterval(timer);timer=null;} }
$('refreshBtn').onclick=refresh;
$('posDia').onchange=e=>{posDia=+e.target.value;buildTrack();refresh()};

/* ---- 駅クリック：同じ駅がある別路線へ ---- */
function otherRoutesWithStation(name){
  return ROUTES.map((r,i)=>i).filter(i=>i!==curRoute && routeData(i).stations.some(st=>st.name===name));
}
function openXfer(name){
  const list=otherRoutesWithStation(name);
  $('modal').innerHTML=`<div class="mh"><span>${esc(name)}</span><button id="mclose" aria-label="閉じる">×</button></div>
    <div class="mb"><p style="margin:0 0 8px;color:#555;font-size:14px">この駅を通る他の路線</p>
    <ul class="xlist">${list.map(i=>`<li><button data-i="${i}">${esc(routeName(i))}</button></li>`).join('')}</ul></div>`;
  $('mclose').onclick=closeModal;
  $('modal').querySelectorAll('.xlist button').forEach(b=>b.onclick=()=>{ closeModal(); setRoute(+b.dataset.i); go('pos'); });
  $('modalbg').classList.add('show');
}

/* ---- 列車ポップアップ ---- */
function openModal(k){ selected=k; $('modalbg').classList.add('show'); renderModal(curT); }
function closeModal(){ $('modalbg').classList.remove('show'); selected=null; }
$('modalbg').onclick=e=>{ if(e.target===$('modalbg')) closeModal(); };
function renderModal(t){
  const tr=data.dias[posDia].trains[selected]; if(!tr) return;
  const loc=locate(tr,t);
  const dest=tr.destIdx!=null? data.stations[tr.destIdx].name:'';
  const head=!loc?'運行時間外': loc.state==='stop'? `${data.stations[loc.idx].name}` : `${data.stations[loc.from].name}→${data.stations[loc.to].name}`;
  const last=tr.stops[tr.stops.length-1];
  const rows=tr.stops.map(s=>{
    const st=data.stations[s.idx]; let cls='';
    if(loc){ if(loc.state==='stop'&&s.idx===loc.idx) cls='now'; else if(s.dep!=null&&s.dep<loc.now) cls='done'; }
    if(s.kind===2) return `<tr class="${cls}"><td class="pass">${esc(st.name)}</td><td class="t pass">${s.arr!=null?fmtHM(s.arr):''}</td><td class="t pass">レ</td><td class="pass">${esc(trackName(s))}</td></tr>`;
    return `<tr class="${cls}"><td>${esc(st.name)}</td><td class="t">${(s.arr!==s.dep||s===last)?fmtHM(s.arr):''}</td><td class="t">${s!==last?fmtHM(s.dep):''}</td><td>${esc(trackName(s))}</td></tr>`;
  }).join('');
  $('modal').innerHTML=`<div class="mh"><span>${esc(head)}</span><button id="mclose" aria-label="閉じる">×</button></div>
    <div class="mb">
      <div class="l1"><span class="num">${esc(tr.trainNo)}</span> <span class="typ">[${esc(tr.type.name)}]</span> ${esc(dest)}</div>
      <div class="l2">${tr.cars}両編成　<span style="color:#666;font-size:14px">運用 ${esc(tr.opNo)}</span></div>
      <table><thead><tr><th>駅</th><th style="text-align:right">着</th><th style="text-align:right">発</th><th>番線</th></tr></thead><tbody>${rows}</tbody></table>
      ${tr.bikou?`<p class="bikou">備考: ${esc(tr.bikou)}</p>`:''}</div>`;
  $('mclose').onclick=closeModal;
}

/* ========== 運用表 ========== */
let opsState={dia:null, op:null};
function renderOps(){
  const t=nowSec(); $('opsNow').textContent=`${dateStr()} ${fmt(t)} 現在`;
  const body=$('opsBody');
  if(opsState.dia==null){
    body.innerHTML=ROUTES.map((r,ri)=>{ const d=routeData(ri);
      return `<h2>${esc(d.rosenName)}</h2><ul>${d.dias.map((x,i)=>`<li><a class="${x.holiday?'hd':'wd'}" data-r="${ri}" data-d="${i}">${esc(d.rosenName)} ${x.holiday?'休日':'平日'}</a></li>`).join('')}</ul>`; }).join('<div style="height:18px"></div>');
    body.querySelectorAll('a').forEach(a=>a.onclick=()=>{ setRoute(+a.dataset.r); go('ops',{dia:+a.dataset.d,op:null}); });
    return;
  }
  const dia=data.dias[opsState.dia];
  const todayDia = pickDia(data.dias)===opsState.dia;   // 今日のダイヤのときだけ「運用中」を判定
  if(opsState.op==null){
    const ops=[...new Set(dia.trains.map(x=>x.opNo))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
    body.innerHTML=`<h2>${esc(dia.name)}</h2><ul class="compact">${ops.map(o=>{
      return `<li><a class="wd" data-o="${esc(o)}">${esc(o)}運用</a></li>`;}).join('')}</ul>`;
    body.querySelectorAll('a').forEach(a=>a.onclick=()=>go('ops',{dia:opsState.dia,op:a.dataset.o}));
    return;
  }
  const list=dia.trains.filter(x=>x.opNo===opsState.op&&x.first).sort((a,b)=>a.first.dep-b.first.dep);
  const rows=list.map(x=>{
    const run=todayDia&&isRunning(x,t);
    const A=data.stations[Math.min(x.first.idx,x.lastStop.idx)], B=data.stations[Math.max(x.first.idx,x.lastStop.idx)];
    // 左＝起点側の駅、右＝終点側の駅。矢印で方向を示す
    const lt= x.down? fmtHMM(x.first.dep) : fmtHMM(x.lastStop.arr);
    const rt= x.down? fmtHMM(x.lastStop.arr) : fmtHMM(x.first.dep);
    return `<tr class="${run?'run':''}"><td class="no">${esc(x.trainNo)}<small>${esc(x.type.name)}</small></td><td>${esc(A.name)}</td><td class="t">${lt}</td><td class="ar">${x.down?'→':'←'}</td><td>${esc(B.name)}</td><td class="t">${rt}</td></tr>`;
  }).join('');
  body.innerHTML=`<div class="box"><h3>${esc(opsState.op)}運用</h3><table class="flow"><tbody>${rows}</tbody></table>
    <p class="note">${todayDia?'赤字は現在運行中の列車です。':`（${esc(dia.name)}は本日のダイヤではないため、運用中表示はありません）`}</p></div>`;
}

/* ========== 時刻表 ========== */
$('ttDia').onchange=()=>{updateHourOptions();renderTT();}; $('ttDir').onchange=()=>{updateHourOptions();renderTT();}; $('ttHour').onchange=renderTT;
$('ttRoute').onchange=()=>{ setRoute(+$('ttRoute').value); renderTT(); };
function refreshTTRoute(){ $('ttRoute').innerHTML=ROUTES.map((r,i)=>`<option value="${i}">${esc(routeName(i))}</option>`).join(''); $('ttRoute').value=curRoute; }
function updateHourOptions(){
  const dia=data.dias[+$('ttDia').value||0], down=$('ttDir').value==='d';
  const hours=[...new Set(dia.trains.filter(x=>x.down===down&&x.first).map(x=>Math.floor(x.first.dep/3600)))].sort((a,b)=>a-b);
  const cur=$('ttHour').value;
  $('ttHour').innerHTML=`<option value="">全時間帯</option>`+hours.map(hh=>`<option value="${hh}">${hh}時台</option>`).join('');
  $('ttHour').value = hours.includes(+cur)? cur : '';
}
function renderTT(){
  const dia=data.dias[+$('ttDia').value||0], down=$('ttDir').value==='d', hour=$('ttHour').value;
  $('ttTitle').textContent=`${data.rosenName} ${down?'下り':'上り'}`;
  let trains=dia.trains.filter(x=>x.down===down&&x.first).sort((a,b)=>a.first.dep-b.first.dep);
  if(hour!=='') trains=trains.filter(x=>Math.floor(x.first.dep/3600)===+hour);
  const order=data.stations.map((_,i)=>i); if(!down) order.reverse();
  let h=`<table class="tt"><thead>
    <tr><th class="stn">運用番号</th>${trains.map(x=>`<th>${esc(x.opNo)}</th>`).join('')}</tr>
    <tr><th class="stn">列車種別</th>${trains.map(x=>`<th>${esc(x.type.name)}</th>`).join('')}</tr>
    <tr><th class="stn">両数</th>${trains.map(x=>`<th><span class="cars">${x.cars}</span></th>`).join('')}</tr></thead><tbody>`;
  for(const i of order){
    const st=data.stations[i];
    h+=`<tr><td class="stn">${esc(st.name)}</td>`;
    for(const x of trains){
      const s=x.stops.find(z=>z.idx===i);
      const mj=st.major?'major':'';
      if(!s){ h+=`<td class="${mj}"></td>`; continue; }
      if(s.kind===2){ h+=`<td class="pass ${mj}">レ</td>`; continue; }
      const tm=(s===x.lastStop)? fmtHMM(s.arr) : fmtHMM(s.dep);
      const trk= st.major? trackName(s):'';
      h+=`<td class="${mj}">${tm}${trk?`<sup>${esc(trk)}</sup>`:''}</td>`;
    }
    h+=`</tr>`;
  }
  h+=`</tbody></table>`;
  $('ttBody').innerHTML=h;
}

/* ========== 起動・路線管理 ========== */
let curRoute=0;
function routeData(i){ const r=ROUTES[i]; if(!r.data) r.data=parseOud2(r.text,r.name); return r.data; }
function routeName(i){ return routeData(i).rosenName; }
function setRoute(i){
  curRoute=i; data=routeData(i);
  const opts=data.dias.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('');
  $('posDia').innerHTML=opts; $('ttDia').innerHTML=opts;
  posDia=pickDia(data.dias); $('posDia').value=posDia; $('ttDia').value=posDia;
  updateHourOptions();
}
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const buf=await f.arrayBuffer();
  let text=new TextDecoder('utf-8').decode(buf);
  if(/\uFFFD/.test(text)){ try{text=new TextDecoder('shift_jis').decode(buf);}catch(_){} }
  ROUTES.push({name:f.name.replace(/\.(oud2?|txt)$/i,''), text});
  try{ setRoute(ROUTES.length-1); nav.length=0; go('home'); alert(`${data.rosenName} を追加しました`); }catch(err){ ROUTES.pop(); alert('読み込めませんでした: '+err.message); }
  $('menu').classList.remove('show'); e.target.value='';
};
setRoute(0); go('home');
</script>
